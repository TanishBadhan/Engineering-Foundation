# This workflow runs Python linting and tests when pytest test files exist.
# See https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat other lint findings as warnings for now.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest (when tests exist)
      shell: bash
      run: |
        if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) \
          ! -path './.git/*' ! -path './.venv/*' -print -quit | grep -q .; then
          python -m pytest
        else
          echo "No pytest test files found; skipping tests until a test suite is added."
        fi
